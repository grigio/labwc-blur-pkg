name: Build Arch packages

on:
  push:
    branches: [master, main]
    paths:
      - 'PKGBUILD'
      - 'scenefx/PKGBUILD'
      - '.github/workflows/build.yml'
  schedule:
    # every 3h: picks up new commits pushed to grigio/labwc ext-background-effect
    - cron: '0 */3 * * *'
  workflow_dispatch:
  # Optional: trigger from the labwc repo with
  #   curl -X POST -H "Authorization: Bearer $TOKEN" \
  #     https://api.github.com/repos/grigio/labwc-blur-pkg/dispatches \
  #     -d '{"event_type":"build-labwc-blur"}'
  repository_dispatch:
    types: [build-labwc-blur]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Base packages + unprivileged build user
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder

      - uses: actions/checkout@v7

      - name: Hand the workspace to the build user
        run: chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build + install scenefx (local dependency, not in the repos)
        working-directory: scenefx
        run: su builder -c 'HOME=/home/builder makepkg -sCi --noconfirm'

      - name: Build labwc-blur (grigio/labwc @ ext-background-effect)
        run: su builder -c 'HOME=/home/builder makepkg -sCi --noconfirm'

      - name: Show packages
        run: ls -l *.pkg.tar.zst scenefx/*.pkg.tar.zst

      # Guards the two ways this pairing can break:
      #   1. labwc-blur linking a soname that our scenefx build does not ship
      #      (or ships under a different soname) -> greetd session dies with
      #      'libscenefx-0.5.so.0 => not found'
      #   2. the versioned dependency being replaced by the bare virtual name
      #      'scenefx', which other distro packages provide with another soname
      - name: Sanity check the packages (soname + real install)
        run: |
          set -euo pipefail
          shopt -s nullglob

          labwc_pkgs=(labwc-blur-*.pkg.tar.zst)
          scenefx_pkgs=(scenefx/scenefx-*.pkg.tar.zst)
          test "${#labwc_pkgs[@]}" -gt 0 || { echo "::error::no labwc-blur package"; exit 1; }
          test "${#scenefx_pkgs[@]}" -gt 0 || { echo "::error::no scenefx package"; exit 1; }

          # -- inspect the packaged files, not the container's installed copy
          tmp=$(mktemp -d)
          for p in "${scenefx_pkgs[@]}" "${labwc_pkgs[@]}"; do
            case "$p" in *-debug-*) continue;; esac
            bsdtar -xf "$p" -C "$tmp"
          done

          need=$(readelf -d "$tmp/usr/bin/labwc" \
            | sed -n 's/.*Shared library: \[\(libscenefx[^]]*\)\].*/\1/p')
          echo "labwc NEEDED libscenefx: ${need:-<none>}"
          test -n "$need" || { echo "::error::labwc does not link scenefx?"; exit 1; }
          test -e "$tmp/usr/lib/$need" \
            || { echo "::error::scenefx package does not ship $need"; exit 1; }

          soname=$(readelf -d "$tmp/usr/lib/$need" \
            | sed -n 's/.*SONAME.*\[\(.*\)\].*/\1/p')
          echo "packaged scenefx SONAME: $soname"
          test "$soname" = "$need" \
            || { echo "::error::soname '$soname' != needed '$need'"; exit 1; }
          rm -rf "$tmp"

          # -- end to end: install exactly what a user downloads
          pacman -U --noconfirm "${scenefx_pkgs[@]}" "${labwc_pkgs[@]}"
          pacman -Q labwc-blur scenefx
          pacman -Qi labwc-blur | grep -q 'scenefx-0.5' \
            || { echo "::error::labwc-blur must depend on the versioned scenefx-0.5"; exit 1; }

          ldd /usr/bin/labwc | tee ldd.out
          if grep -q 'not found' ldd.out; then
            echo "::error::unresolved shared libraries in /usr/bin/labwc"
            grep 'not found' ldd.out
            exit 1
          fi
          labwc --version

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: arch-packages
          path: |
            *.pkg.tar.zst
            scenefx/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 30

      - name: Publish packages to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # One release per built version: the tag v<pkgver>-<pkgrel> embeds the
        # labwc short-sha (pkgver comes from git describe), so every new commit
        # on grigio/labwc ext-background-effect produces its own release, while
        # a rebuild of the same version only refreshes the existing assets.
        run: |
          set -euo pipefail
          pacman -S --noconfirm github-cli

          ver=""
          for f in labwc-blur-*.pkg.tar.zst; do
            case "$f" in *-debug-*) continue;; esac
            ver="${f#labwc-blur-}"; ver="${ver%-x86_64.pkg.tar.zst}"; break
          done
          test -n "$ver" || { echo "no labwc-blur package found"; exit 1; }
          tag="v$ver"

          # full sha from the cloned source; fall back to the short sha
          # embedded in pkgver (…g<sha>), stripping the -<pkgrel> suffix
          sha=$(git -c safe.directory='*' -C src/labwc-blur \
            rev-parse --short=12 HEAD 2>/dev/null || true)
          if test -z "$sha"; then
            case "$ver" in *.g*) sha=${ver##*.g}; sha=${sha%%-*};; *) sha=unknown;; esac
          fi
          notes="Automatic build of [grigio/labwc ext-background-effect](https://github.com/grigio/labwc/tree/ext-background-effect) @ \`$sha\`.

          Install **both** packages — \`labwc-blur\` links against the soname
          shipped by this \`scenefx\` build (\`libscenefx-0.5.so.0\`):

          \`\`\`sh
          sudo pacman -U scenefx-*.pkg.tar.zst labwc-blur-*.pkg.tar.zst
          \`\`\`

          If pacman asks to remove \`scenefx-wlroots20-git\` (CachyOS) and/or the
          official \`labwc\`, answer **yes**: the soname / package name differs.

          If the session fails to start, check \`ldd /usr/bin/labwc | grep scenefx\`
          (it must print a path, not \`not found\`)."

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag exists, refreshing notes + assets"
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --notes "$notes" --latest
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
              labwc-blur-*.pkg.tar.zst scenefx/scenefx-*.pkg.tar.zst
          else
            echo "Creating release $tag"
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "labwc-blur $ver" --notes "$notes" --latest \
              labwc-blur-*.pkg.tar.zst scenefx/scenefx-*.pkg.tar.zst
          fi
